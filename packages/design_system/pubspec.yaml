name: carteira_design_system
description: Tokens, theme and UI components of the Carteira app.
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
  assets:
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
