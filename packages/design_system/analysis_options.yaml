include: ../../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - example/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - use_key_in_widget_constructors
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    # Every public member of lib/ carries a dartdoc (the README points here).
    - public_member_api_docs
